<div data-blueprint-component="email-capture" data-blueprint-state="initial" role="form" aria-label="Email capture">
  <blueprint-use kind="primitive" ref="input" state="empty" variant="ghost" class="email-capture__field">
    <span slot="label">Email address</span>
    <b slot="placeholder"><slot name="placeholder">you@example.com</slot></b>
  </blueprint-use>
  <blueprint-use kind="primitive" ref="button" state="normal" variant="primary" class="email-capture__submit">
    <b slot="label"><slot name="cta">Save my spot</slot></b>
  </blueprint-use>
</div>
