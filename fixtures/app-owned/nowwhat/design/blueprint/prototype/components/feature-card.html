<article data-blueprint-component="feature-card" data-blueprint-state="initial">
  <span class="feature-card__tile">
    <blueprint-use kind="primitive" ref="icon" state="default" variant="accent" class="feature-card__glyph">
      <slot name="glyph"></slot>
    </blueprint-use>
  </span>
  <div class="feature-card__media" data-blueprint-slot="media"></div>
  <p class="feature-card__tag" data-blueprint-slot="tag">Mid-stream</p>
  <h3 class="feature-card__title" data-blueprint-slot="title">Feature</h3>
  <p class="feature-card__copy" data-blueprint-slot="copy">What this capability does for your shows.</p>
</article>
