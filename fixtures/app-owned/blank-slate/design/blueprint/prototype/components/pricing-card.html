<article data-blueprint-component="pricing-card" data-blueprint-state="initial">
  <span class="pricing-card__flag" data-blueprint-slot="flag"></span>
  <h3 class="pricing-card__tier" data-blueprint-slot="tier">Starter</h3>
  <p class="pricing-card__price-row">
    <b class="pricing-card__price" data-blueprint-slot="price">$0</b>
    <span class="pricing-card__period" data-blueprint-slot="period">forever</span>
  </p>
  <p class="pricing-card__blurb" data-blueprint-slot="blurb">For side projects and first agents.</p>
  <ul class="pricing-card__features" data-blueprint-slot="features">
    <li>1,000 runs / month</li>
  </ul>
  <blueprint-use kind="primitive" ref="button" state="normal" variant="outline" class="pricing-card__cta">
    <b slot="label"><slot name="cta">Choose plan</slot></b>
  </blueprint-use>
</article>
