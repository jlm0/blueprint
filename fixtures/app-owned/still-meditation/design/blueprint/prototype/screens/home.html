<main class="still-home" data-blueprint-screen="home" data-blueprint-state="default">
  <div class="still-home__atmosphere" aria-hidden="true"></div>

  <div class="still-home__content">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Still home">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 28 28" fill="none">
            <path d="M14 23.5c-.8-6.1 1.2-10.8 6.1-14.2" />
            <path d="M14.2 20.3c-4.8-.7-7.8-3.5-9-8.4 4.9-.4 8.2 2.4 9 8.4Z" />
            <path d="M15 14.2c.7-4.8 3.5-7.8 8.4-9 .4 4.9-2.4 8.2-8.4 9Z" />
          </svg>
        </span>
        <span>still</span>
      </a>

      <button class="profile" type="button" aria-label="Open Maya's profile">
        <span aria-hidden="true">M</span>
        <span class="profile__presence" aria-hidden="true"></span>
      </button>
    </header>

    <section class="welcome" data-blueprint-section="welcome" aria-labelledby="welcome-title">
      <div class="welcome__copy">
        <p class="eyebrow">Morning practice · Maya</p>
        <h1 id="welcome-title">Your pause<br />is ready.</h1>
      </div>
      <div class="welcome__date" aria-label="August 18">
        <strong>18</strong>
        <span>Aug</span>
      </div>
    </section>

    <section class="featured" data-blueprint-section="featured-practice" aria-labelledby="featured-title">
      <div class="featured__wash" aria-hidden="true"></div>
      <div class="featured__topline">
        <blueprint-use kind="primitive" ref="badge" state="default" variant="tonal">
          <span slot="label">Focus</span>
        </blueprint-use>
        <span class="featured__index" aria-hidden="true">01 / 05</span>
      </div>

      <div class="featured__body">
        <div class="featured__copy">
          <p class="featured__kicker">Today's guided practice</p>
          <h2 id="featured-title">Find your<br />center</h2>
          <p class="featured__description">Breathwork · with Elena</p>
        </div>
        <div class="breath-orb" aria-hidden="true">
          <span class="breath-orb__ring breath-orb__ring--outer"></span>
          <span class="breath-orb__ring breath-orb__ring--middle"></span>
          <span class="breath-orb__core"></span>
        </div>
      </div>

      <div class="featured__footer">
        <span class="duration">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <circle cx="10" cy="10" r="7.25"></circle>
            <path d="M10 6.3v4.1l2.65 1.55"></path>
          </svg>
          10 min
        </span>
        <blueprint-use kind="primitive" ref="button" state="normal" variant="primary">
          <span slot="label">Start</span>
        </blueprint-use>
      </div>
    </section>

    <div class="practice-grid">
      <section class="rhythm" data-blueprint-section="daily-rhythm" aria-label="Weekly practice rhythm">
        <div class="rhythm__top">
          <span class="rhythm__icon" aria-hidden="true">✦</span>
          <strong class="rhythm__score">4 / 5</strong>
        </div>
        <div class="rhythm__copy">
          <span>
            <strong>Weekly rhythm</strong>
            <small>Four days settled</small>
          </span>
        </div>
        <div class="rhythm__days" aria-label="Four of five practice days complete">
          <i class="is-complete"></i>
          <i class="is-complete"></i>
          <i class="is-complete"></i>
          <i class="is-complete"></i>
          <i></i>
        </div>
      </section>

      <section class="moment" data-blueprint-section="recommendation" aria-labelledby="moment-title">
        <div class="section-heading">
          <h2 id="moment-title">Next up</h2>
          <a href="#">Library</a>
        </div>
        <button class="practice-row" type="button">
          <span class="practice-row__art" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none">
              <path d="M9 28c8-13 17-16 30-8" />
              <path d="M11 34c10-10 19-11 28-3" />
              <circle cx="32.5" cy="14.5" r="4.5" />
            </svg>
          </span>
          <span class="practice-row__copy">
            <strong>Release the rush</strong>
            <small>6 min · Grounding</small>
          </span>
          <span class="practice-row__play" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="m9.5 7 7 5-7 5Z"></path></svg>
          </span>
        </button>
      </section>
    </div>
  </div>

  <nav class="tabbar" data-blueprint-section="navigation" aria-label="Primary navigation">
    <a class="tabbar__item is-active" href="#" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 10.2 12 4l7 6.2V20h-5v-5h-4v5H5Z"></path></svg>
      <span>Today</span>
    </a>
    <a class="tabbar__item" href="#">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="m14.8 9.2-1.7 3.9-3.9 1.7 1.7-3.9Z"></path></svg>
      <span>Explore</span>
    </a>
    <a class="tabbar__item" href="#">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M18.8 14.7A7.6 7.6 0 0 1 9.3 5.2a7.6 7.6 0 1 0 9.5 9.5Z"></path></svg>
      <span>Sleep</span>
    </a>
    <a class="tabbar__item" href="#">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8.2" r="3.2"></circle><path d="M5.8 19.2c.7-3.3 2.8-5 6.2-5s5.5 1.7 6.2 5"></path></svg>
      <span>You</span>
    </a>
  </nav>
</main>
