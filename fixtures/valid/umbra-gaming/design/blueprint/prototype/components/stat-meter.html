<div class="stat-meter" data-blueprint-component="stat-meter">
  <blueprint-use kind="primitive" ref="text" size="label" variant="muted">
    <span slot="text" class="stat-meter__label" data-blueprint-slot="label">Eliminations</span>
  </blueprint-use>
  <blueprint-use kind="primitive" ref="text" size="display" class="stat-meter__value">
    <span slot="text" class="stat-meter__figure" data-blueprint-slot="value">11</span>
  </blueprint-use>
  <span class="stat-meter__bar stat-meter__bar--above" role="progressbar" aria-label="Compared with your average" aria-valuemin="0" aria-valuemax="100" aria-valuenow="74"><span class="stat-meter__fill"></span></span>
  <span class="stat-meter__bar stat-meter__bar--average" role="progressbar" aria-label="Compared with your average" aria-valuemin="0" aria-valuemax="100" aria-valuenow="52"><span class="stat-meter__fill"></span></span>
  <span class="stat-meter__bar stat-meter__bar--below" role="progressbar" aria-label="Compared with your average" aria-valuemin="0" aria-valuemax="100" aria-valuenow="28"><span class="stat-meter__fill"></span></span>
  <span class="stat-meter__bar stat-meter__bar--record" role="progressbar" aria-label="Compared with your average" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><span class="stat-meter__fill"></span></span>
  <blueprint-use kind="primitive" ref="text" size="body" variant="muted" class="stat-meter__delta">
    <span slot="text" class="stat-meter__comparison" data-blueprint-slot="delta">+4 vs your average</span>
  </blueprint-use>
</div>
